<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Cyber Jagrithi</title>
    <link
      href="https:
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f9fafb;
        color: #2b0000;
        line-height: 1.6;
        min-height: 100vh;
        margin: 0;
        font-family: "Roboto", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
      }
      .contact-container {
        max-width: 900px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      .contact-section {
        margin-bottom: 40px;
      }
      .contact-section:last-child {
        margin-bottom: 0;
      }
      .contact-section h2 {
        color: #7a0000;
        font-size: 1.8rem;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .contact-section p {
        color: #4b5563;
        line-height: 1.6;
        margin-bottom: 16px;
      }
      .contact-info {
        background: #f8fafc;
        padding: 24px;
        border-radius: 8px;
        margin-top: 12px;
      }
      .contact-info h3 {
        color: #1f2937;
        margin-bottom: 16px;
      }
      .contact-info p {
        margin: 8px 0;
      }
      .contact-info a {
        color: #7a0000;
        text-decoration: none;
      }
      .contact-info a:hover {
        text-decoration: underline;
      }
      .social-icons {
        display: flex;
        gap: 1.5em;
        margin-top: 1em;
        align-items: center;
      }
      .social-icon {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #f3f3f3;
        color: #800000;
        font-size: 1.5em;
        transition: background 0.2s, color 0.2s;
        text-decoration: none;
      }
      .social-icon:hover {
        background: #800000;
        color: #fff;
      }
      @media (max-width: 600px) {
        .contact-container {
          padding: 1em;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <main>
      <div class="contact-container">
        <div class="contact-section">
          <h2>Contact Us</h2>
          <p>
            We value your feedback, questions, and partnership opportunities.
            Please use the information below to reach the right team at Cyber
            Jagrithi.
          </p>
        </div>
        <div class="contact-section contact-info">
          <h3>General Support</h3>
          <p>
            Email:
            <a href="mailto:support@cyberjagrithi.com"
              >support@cyberjagrithi.com</a
            >
          </p>
        </div>
        <div class="contact-section contact-info">
          <h3>Enterprise/API Inquiries</h3>
          <p>
            Email:
            <a href="mailto:enterprise@cyberjagrithi.com"
              >enterprise@cyberjagrithi.com</a
            >
          </p>
        </div>
        <div class="contact-section contact-info">
          <h3>Follow Us</h3>
          <div class="social-icons">
            <a href="#" class="social-icon" title="Twitter (placeholder)"
              ><span>X</span></a
            >
            <a href="#" class="social-icon" title="LinkedIn (placeholder)"
              ><span>in</span></a
            >
          </div>
        </div>
      </div>
    </main>
    <div id="footer-include"></div>
    <script>
      ["header", "footer"].forEach((id) => {
        fetch(`../${id}.html`)
          .then((r) => r.text())
          .then((html) => {
            document.getElementById(`${id}-include`).innerHTML = html;
          });
      });
    </script>
  </body>
</html>
