<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse NS Lookup</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: background 0.2s;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
      }
      .tab {
        padding: 12px 0;
        font-weight: 500;
        color: #222;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-decoration: none;
      }
      .tab.active {
        border-bottom: 2px solid #7a0000;
        color: #7a0000;
      }
      .results-header {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 24px 0 8px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 8px;
      }
      th {
        background: #f3f4f6;
        color: #444;
        font-weight: 600;
        border-bottom: 1px solid #e5e7eb;
      }
      tr:nth-child(even) {
        background: #fafbfc;
      }
      tr:hover {
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div id="app">
      <div class="container">
        <h1>Reverse NS Lookup</h1>
        <div class="desc">
          Find all domains using a specific nameserver. Useful for identifying
          domains managed by the same hosting provider or organization.
        </div>
        <form class="search-box" autocomplete="off">
          <input
            type="text"
            name="ns"
            placeholder="Enter nameserver (e.g. ns1.example.com)"
            required
          />
          <button type="submit">Lookup</button>
        </form>
        <div class="tabs" style="display: none">
          <a href="#" class="tab active">HTML</a>
          <a href="#" class="tab">JSON</a>
        </div>
        <div class="results" style="margin-bottom: 32px; display: none"></div>
      </div>
    </div>
    <div id="footer-include"></div>
    <script>
      (function () {
        let currentTab = "html";
        let lastQuery = "";
        let lastDomains = [];
        const container = document.querySelector(".container");
        const form = container.querySelector(".search-box");
        const input = form.querySelector("input");
        const tabs = container.querySelector(".tabs");
        const htmlTab = tabs.querySelectorAll(".tab")[0];
        const jsonTab = tabs.querySelectorAll(".tab")[1];
        const resultsDiv = container.querySelector(".results");
        function switchTab(tab) {
          currentTab = tab;
          htmlTab.className = "tab" + (tab === "html" ? " active" : "");
          htmlTab.style.borderBottom =
            tab === "html" ? "2px solid #7a0000" : "2px solid transparent";
          htmlTab.style.color = tab === "html" ? "#7a0000" : "#222";
          jsonTab.className = "tab" + (tab === "json" ? " active" : "");
          jsonTab.style.borderBottom =
            tab === "json" ? "2px solid #7a0000" : "2px solid transparent";
          jsonTab.style.color = tab === "json" ? "#7a0000" : "#222";
          renderResults(lastQuery, lastDomains);
        }
        htmlTab.addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("html");
        });
        jsonTab.addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("json");
        });
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          const query = input.value.trim();
          if (!query) return;
          const resp = await fetch(
            `/reverse-ns-lookup/backend.php?ns=${encodeURIComponent(query)}`
          );
          const data = await resp.json();
          const domains = data.response.domains || [];
          lastQuery = query;
          lastDomains = domains;
          tabs.style.display = "flex";
          resultsDiv.style.display = "block";
          renderResults(query, domains);
        });
        function renderResults(query, domains) {
          resultsDiv.innerHTML = "";
          if (!query) return;
          const header = document.createElement("div");
          header.className = "results-header";
          header.innerHTML = `Domains using nameserver <b>${escapeHtml(
            query
          )}</b>`;
          resultsDiv.appendChild(header);
          if (currentTab === "json") {
            const json = {
              query: { tool: "reverse-ns-lookup", nameserver: query },
              response: { domains },
            };
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(json, null, 2);
            pre.style.background = "#f3f4f6";
            pre.style.padding = "16px";
            pre.style.borderRadius = "8px";
            pre.style.overflow = "auto";
            pre.style.maxHeight = "420px";
            pre.style.fontSize = "1rem";
            pre.style.boxShadow = "none";
            pre.style.margin = "0";
            resultsDiv.appendChild(pre);
          } else {
            const table = document.createElement("table");
            table.innerHTML =
              "<thead><tr><th>Domain</th><th>Nameservers</th><th>Last Updated</th></tr></thead>";
            const tbody = document.createElement("tbody");
            if (Array.isArray(domains)) {
              domains.forEach((domain) => {
                const tr = document.createElement("tr");
                const tdDomain = document.createElement("td");
                tdDomain.textContent = domain.name || "";
                tr.appendChild(tdDomain);
                const tdNameservers = document.createElement("td");
                tdNameservers.textContent = domain.nameservers || "";
                tr.appendChild(tdNameservers);
                const tdUpdated = document.createElement("td");
                tdUpdated.textContent = domain.updated || "";
                tr.appendChild(tdUpdated);
                tbody.appendChild(tr);
              });
            }
            table.appendChild(tbody);
            resultsDiv.appendChild(table);
          }
        }
        function escapeHtml(str) {
          return str.replace(/[&<>"']/g, function (tag) {
            const charsToReplace = {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            };
            return charsToReplace[tag] || tag;
          });
        }
        renderResults("", []);
      })();

      ["header", "footer"].forEach((id) => {
        fetch(`../${id}.html`)
          .then((r) => r.text())
          .then((html) => {
            document.getElementById(`${id}-include`).innerHTML = html;
          });
      });
    </script>
  </body>
</html>
