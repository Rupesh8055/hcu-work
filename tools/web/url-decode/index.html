<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL / String Decode Tool</title>
    <meta name="description" content="Convert URL-encoded strings back to their original format. Useful for analyzing suspicious URLs, troubleshooting web application issues, and forensic investigation of web traffic.">
    <meta property="og:title" content="URL Decode - Cyber Jagrithi">
    <meta property="og:description" content="Convert URL-encoded strings back to their original format. Useful for analyzing suspicious URLs, troubleshooting web application issues, and forensic investigation of web traffic.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="../../favicon.png" />
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
        min-width: 120px;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .search-box button:disabled {
        background: #7a0000;
        opacity: 0.7;
        cursor: not-allowed;
      }
      .loading-spinner-btn {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #fff;
        border-top: 2px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }
      .results-section {
        display: none;
        margin-top: 24px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
        padding: 12px 16px 20px 16px;
      }
      .result-box {
        background: #f8f9fa;
        padding: 16px;
        border-radius: 6px;
        font-size: 1rem;
        word-break: break-all;
        border: 1px solid #e2e8f0;
        font-family: monospace;
        color: #1f2937;
        margin-top: 8px;
      }
      .results-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: #333;
        margin: 0 0 8px 0;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #header-include header h1 a { color: #fff !important; }
      @media (max-width: 768px) {
        .container { padding: 20px; }
        .search-box { flex-direction: column; }
        .search-box button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div class="container">
      <h1>URL / String Decode Tool</h1>
      <div class="desc">
        Decode URL's or strings that contain data in the format '%xx'. For
        example, '%48%45%4C%4C%4F' decodes to 'HELLO'. Useful in decoding
        confusing URL's.
      </div>
      <form class="search-box" id="decodeForm" autocomplete="off">
        <input
          type="text"
          id="encodedText"
          placeholder="Enter URL encoded string"
          required
          aria-label="URL-encoded text"
        />
        <button type="submit" id="submitBtn">Decode</button>
      </form>
      <div class="results-section" id="resultsSection">
        <h3 class="results-title">Decoded Result:</h3>
        <div class="result-box" id="decodedResult"></div>
      </div>
    </div>
    <div id="footer-include"></div>
    <script src="../../assets/js/utils.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.CJ && window.CJ.loadHeaderFooter) {
            window.CJ.loadHeaderFooter("../../");
        }
      });
    </script>
    <script>
      (function () {
        const form = document.getElementById("decodeForm");
        const input = document.getElementById("encodedText");
        const resultsSection = document.getElementById("resultsSection");
        const decodedResult = document.getElementById("decodedResult");
        const submitBtn = document.getElementById("submitBtn");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          const encodedText = input.value.trim();
          if (!encodedText) return;
          const originalButtonText = submitBtn.textContent;
          submitBtn.innerHTML = '<span class="loading-spinner-btn"></span>Decoding...';
          submitBtn.disabled = true;
          resultsSection.style.display = "block";
          decodedResult.textContent = "";
          const url = `backend.php?input=${encodeURIComponent(encodedText)}`;
          fetch(url)
            .then((r) => r.json())
            .then((data) => {
              if (data && data.errors && data.errors.length > 0) {
                decodedResult.textContent = `Error: ${data.errors[0]}`;
                decodedResult.style.color = "#b91c1c";
                return;
              }
              const response = data && data.data ? data.data : {};
              if (response.error) {
                decodedResult.textContent = `Error: ${response.error}`;
                decodedResult.style.color = "#b91c1c";
              } else if (typeof response.decoded !== "undefined") {
                decodedResult.textContent = response.decoded;
                decodedResult.style.color = "#1f2937";
              } else {
                decodedResult.textContent = "Error: Unexpected response";
              }
            })
            .catch(() => {
              decodedResult.textContent = "Error: Request failed";
              decodedResult.style.color = "#b91c1c";
            })
            .finally(() => {
              submitBtn.textContent = originalButtonText;
              submitBtn.disabled = false;
            });
        });
        window.CJ.autoLookup("decodeForm", "encodedText");
      })();
    </script>
  </body>
</html>
