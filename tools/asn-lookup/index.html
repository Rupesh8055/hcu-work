<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASN Lookup Tool</title>
    <style>
      body { 
        background-color: #f3f4f6; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
    /**
     * Fetches ASN data from the PHP backend.
     * @param {string} query The ASN to look up.
     * @returns {Promise<object>} A promise that resolves to the ASN information object.
     */
    async function lookupAsnOnBackend(query) {
        try {
            // This URL now points directly to our PHP script.
            const response = await fetch(`lookup.php?asn=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (!response.ok) {
                // Use the error message from the PHP backend, or a default one.
                return { Error: data.Error || `Server returned an error: ${response.status}` };
            }
            return data;
        } catch (error) {
            console.error("Frontend Error:", error);
            return { Error: "Failed to connect to the server. Please check your connection and try again." };
        }
    }

    // --- UI Creation ---
    const app = document.getElementById("app");

    const container = document.createElement("div");
    container.className = "container";
    container.style.maxWidth = "1150px";
    container.style.margin = "30px auto";
    container.style.background = "#fff";
    container.style.borderRadius = "12px";
    container.style.boxShadow = "0 2px 8px rgba(0,0,0,0.08)";
    container.style.padding = "32px 32px 24px 32px";
    app.appendChild(container);

    const title = document.createElement("h1");
    title.textContent = "ASN Lookup";
    title.style.fontSize = "2rem";
    title.style.fontWeight = "600";
    title.style.marginBottom = "8px";
    container.appendChild(title);

    const desc = document.createElement("div");
    desc.textContent = "Retrieve detailed information about an Autonomous System Number.";
    desc.style.color = "#555";
    desc.style.marginBottom = "24px";
    container.appendChild(desc);

    const form = document.createElement("form");
    form.className = "search-box";
    form.style.display = "flex";
    form.style.gap = "12px";
    form.style.marginBottom = "24px";
    container.appendChild(form);

    const input = document.createElement("input");
    input.type = "text";
    input.name = "asn";
    input.placeholder = "Enter ASN (e.g. AS7922)";
    input.required = true;
    input.style.flex = "1";
    input.style.padding = "12px";
    input.style.border = "1px solid #d1d5db";
    input.style.borderRadius = "6px";
    input.style.fontSize = "1rem";
    input.style.boxShadow = "0 1px 2px rgba(0,0,0,0.03)";
    form.appendChild(input);

    const button = document.createElement("button");
    button.type = "submit";
    button.textContent = "Lookup";
    button.style.background = "#7a0000";
    button.style.color = "#fff";
    button.style.border = "none";
    button.style.borderRadius = "6px";
    button.style.padding = "0 28px";
    button.style.fontSize = "1rem";
    button.style.fontWeight = "600";
    button.style.cursor = "pointer";
    button.style.boxShadow = "0 1px 2px rgba(0,0,0,0.04)";
    button.onmouseover = () => { if(!button.disabled) button.style.background = "#5a0000"; };
    button.onmouseout = () => { if(!button.disabled) button.style.background = "#7a0000"; };
    form.appendChild(button);

    const resultsDiv = document.createElement("div");
    resultsDiv.style.position = "relative";
    resultsDiv.style.borderRadius = "8px";
    resultsDiv.style.border = "1px solid #e5e7eb";
    resultsDiv.style.overflow = "hidden"; // Ensures child elements conform to border radius

    // --- Form Submission Logic ---
    form.onsubmit = async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;

        // 1. Set loading state
        button.disabled = true;
        button.textContent = "Looking up...";
        button.style.background = "#9ca3af";
        button.style.cursor = "wait";
        
        if (!container.contains(resultsDiv)) {
            container.appendChild(resultsDiv);
        }
        
        // 2. Show loading message and perform lookup
        renderResults(query, { Status: "Loading..." });
        const asnInfo = await lookupAsnOnBackend(query);
        
        // 3. Render the final results
        renderResults(query, asnInfo);

        // 4. Reset button state
        button.disabled = false;
        button.textContent = "Lookup";
        button.style.background = "#7a0000";
        button.style.cursor = "pointer";
    };

    /**
     * Renders the results or an error message in the results container.
     * @param {string} query The original query.
     * @param {object} asnInfo The object containing ASN data or an Error property.
     */
    function renderResults(query, asnInfo) {
        resultsDiv.innerHTML = ""; // Clear previous content
        if (!query) return;

        const header = document.createElement("div");
        header.style.fontSize = "1.2rem";
        header.style.fontWeight = "500";
        header.style.padding = "16px 24px";
        header.style.background = "#f9fafb";
        header.style.borderBottom = "1px solid #e5e7eb";
        header.innerHTML = `ASN Information for <b>${escapeHtml(query)}</b>`;
        resultsDiv.appendChild(header);

        const contentWrapper = document.createElement('div');
        contentWrapper.style.padding = '16px 24px';
        resultsDiv.appendChild(contentWrapper);
        
        if (asnInfo && asnInfo.Error) {
            const errorDiv = document.createElement('div');
            errorDiv.style.color = '#991b1b';
            errorDiv.style.background = '#fef2f2';
            errorDiv.style.padding = '12px';
            errorDiv.style.borderRadius = '6px';
            errorDiv.textContent = asnInfo.Error;
            contentWrapper.appendChild(errorDiv);
            return;
        }
        
        const table = document.createElement("table");
        table.style.width = "100%";
        table.style.borderCollapse = "collapse";
        const tbody = document.createElement("tbody");

        if (asnInfo && typeof asnInfo === 'object' && Object.keys(asnInfo).length > 0) {
            Object.entries(asnInfo).forEach(([field, value]) => {
                if (!value) return;
                
                const tr = document.createElement("tr");
                tr.style.borderBottom = "1px solid #f3f4f6";

                const tdField = document.createElement("td");
                tdField.textContent = field.replace(/_/g, ' ');
                tdField.style.padding = "12px 8px";
                tdField.style.fontWeight = "500";
                tdField.style.color = "#374151";
                tdField.style.verticalAlign = "top";
                tdField.style.width = "200px";

                const tdValue = document.createElement("td");
                tdValue.textContent = value;
                tdValue.style.padding = "12px 8px";
                tdValue.style.wordBreak = "break-word";
                tdValue.style.whiteSpace = "pre-wrap"; // Preserve newlines in address, etc.

                tr.appendChild(tdField);
                tr.appendChild(tdValue);
                tbody.appendChild(tr);
            });
             // Remove border from last row for cleaner look
            if(tbody.lastChild) tbody.lastChild.style.borderBottom = 'none';
        }

        table.appendChild(tbody);
        contentWrapper.appendChild(table);
    }

    /**
     * Sanitizes a string to prevent HTML injection.
     * @param {string} str The string to escape.
     */
    function escapeHtml(str) {
        if (!str) return '';
            return str.replace(/[&<>"']/g, (tag) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;' 
            }[tag] || tag));
}
    </script>
</body>
</html>
