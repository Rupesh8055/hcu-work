<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Blog - Cyber Jagrithi</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
        :root {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --primary: #800000;
            --text: #222222;
            --text-muted: #555555;
            --border: #e5e7eb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 2rem; width: 100%; flex-grow: 1; }
        .nav-bar {
            display: flex; justify-content: center; gap: 2rem; margin: 2rem 0;
            padding-bottom: 2rem; border-bottom: 1px solid var(--border);
        }
        .nav-link {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active { color: var(--primary); }
        .placeholder {
            margin: 60px auto 100px; padding: 5rem 3rem; background: var(--surface);
            border-radius: 24px; text-align: center; border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); max-width: 800px;
        }
        .placeholder h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--text); letter-spacing: -1px; }
        .placeholder p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2.5rem; line-height: 1.8; }
        .badge {
            display: inline-block; padding: 8px 16px; background: rgba(128, 0, 0, 0.05);
            color: var(--primary); border: 1px solid rgba(128, 0, 0, 0.1);
            border-radius: 30px; font-weight: 700; font-size: 0.8rem;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2rem;
        }
        .back-btn {
            display: inline-block; padding: 14px 28px; background: var(--primary);
            color: #fff; text-decoration: none; border-radius: 12px;
            font-weight: 700; font-size: 1rem; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(128, 0, 0, 0.1);
        }
        .back-btn:hover { background: #a00000; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="header-include"></div>
    <main class="container">
        <nav class="nav-bar">
            <a href="/tools/index.html" class="nav-link">Home</a>
            <a href="/tools/about.html" class="nav-link">About Us</a>
            <a href="/tools/contact.html" class="nav-link">Contact</a>
            <a href="/tools/blog.html" class="nav-link active">Blog</a>
            <a href="/tools/api.html" class="nav-link">API</a>
        </nav>
        <div class="placeholder">
            <span class="badge">Development Phase</span>
            <h1>Security Blog</h1>
            <p>We are currently curating advanced cybersecurity intelligence and technical briefings. Access to the security blog is restricted during this maintenance cycle.</p>
            <a href="/tools/index.html" class="back-btn">Return to Tools</a>
        </div>
    </main>
    <div id="footer-include"></div>
    <script src="assets/js/utils.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.CJ && window.CJ.loadHeaderFooter) {
            window.CJ.loadHeaderFooter("./");
        }
      });
    </script>
</body>
</html>
