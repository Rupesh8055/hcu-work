<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHOIS Lookup</title>
    <style>
      :root {
        --primary: #7a0000;
        --secondary: #5a0000;
        --bg: #f6f8fa;
        --border: #e5e7eb;
        --input-bg: #fff;
        --input-border: #ccc;
        --error: #c33;
        --success: #363;
      }
      body {
        background: var(--bg);
        font-family: Segoe UI, Arial, sans-serif;
        margin: 0;
      }
      .whois-main {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-family: Segoe UI, Arial, sans-serif;
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        font-family: Segoe UI, Arial, sans-serif;
        color: #555;
        margin-bottom: 24px;
      }
      .whois-form {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .whois-form input[type="text"] {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .whois-form button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .whois-form button:hover {
        background: #5a0000;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        margin-top: 2em;
        padding: 2em 1.5em 1.5em 1.5em;
      }
      .tabs {
        display: flex;
        gap: 1em;
        margin-bottom: 1em;
        align-items: center;
      }
      .tab {
        cursor: pointer;
        padding: 0.5em 1.3em 0.5em 1.3em;
        border-radius: 6px 6px 0 0;
        background: none;
        color: #222;
        border: none;
        border-bottom: 2px solid transparent;
        font-weight: 500;
        font-size: 1rem;
        transition: color 0.2s, border-bottom 0.2s;
      }
      .tab.active {
        color: #7a0000;
        border-bottom: 2px solid #7a0000;
        background: none;
        font-weight: bold;
      }
      .tab-icons {
        margin-left: auto;
        display: flex;
        gap: 1em;
        align-items: center;
      }
      .tab-content {
        background: #fff;
        border-radius: 0 0 12px 12px;
        padding: 1.2em 1em 1em 1em;
      }
      .summary {
        margin-bottom: 1em;
        font-size: 1.2rem;
        color: #230000;
        font-weight: 500;
      }
      .export-btns {
        margin-bottom: 1em;
        display: flex;
        gap: 0.5em;
      }
      .export-btns button {
        padding: 0.5em 1.1em;
        border-radius: 4px;
        border: 1px solid #7a0000;
        background: #fff;
        color: #7a0000;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .export-btns button:hover {
        background: #7a0000;
        color: #fff;
      }
      .whois-results-box {
        background: #f8f8fa;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem 1rem;
        font-family: "Fira Mono", "Consolas", "Courier New", monospace;
        font-size: 1.01rem;
        color: #222;
        white-space: pre-wrap;
        overflow-x: auto;
        max-height: 420px;
        min-height: 120px;
      }
      .whois-loading {
        text-align: center;
        color: #7a0000;
        font-weight: 600;
        margin: 1.5rem 0;
      }
      .whois-error {
        background: #fee;
        color: var(--error);
        border-left: 4px solid var(--error);
        padding: 1rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        text-align: center;
      }

      #header-include header h1 a {
        color: #fff !important;
      }
      #header-include header {
        text-align: center !important;
      }
      #header-include header h1 {
        text-align: center !important;
      }
      @media (max-width: 600px) {
        .whois-main {
          padding: 1.2rem 0.5rem;
        }
        .whois-form input[type="text"] {
          font-size: 1rem;
        }
        .whois-results-box {
          font-size: 0.97rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div class="whois-main">
      <h1>WHOIS Lookup</h1>
      <div class="desc">
        Displays owner/contact information for a domain name or IP address. Can
        also be used to determine if a domain name is registered or not.
      </div>
      <form class="whois-form" id="whoisForm" autocomplete="off">
        <input
          type="text"
          id="domain"
          placeholder="Enter domain or IP"
          required
          aria-label="Domain or IP"
        />
        <button type="submit" id="lookupBtn">Lookup</button>
      </form>
      <div class="card" id="resultsCard" style="display: none">
        <div class="tabs" id="whoisTabs" style="display: none">
          <div class="tab active" id="tab-html">HTML</div>
          <div class="tab" id="tab-json">JSON</div>
          <div class="tab-icons" style="margin-left: auto">
            <span id="copy-icon" style="cursor: pointer" title="Copy"
              ><svg
                width="20"
                height="20"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="9" y="9" width="8" height="8" rx="2" />
                <path
                  d="M15 9V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"
                /></svg
            ></span>
            <span id="download-icon" style="cursor: pointer" title="Download"
              ><svg
                width="20"
                height="20"
                fill="none"
                stroke="#222"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" /></svg
            ></span>
          </div>
        </div>
        <div class="tab-content" id="tab-content-html">
          <div class="summary" id="whoisSummary"></div>
          <div
            id="whoisResultsBox"
            class="whois-results-box"
            style="display: none"
          ></div>
        </div>
        <div class="tab-content" id="tab-content-json" style="display: none">
          <pre id="whoisJsonResults" style="white-space: pre-wrap"></pre>
        </div>
        <div id="whoisError" class="whois-error" style="display: none"></div>
        <div id="whoisLoading" class="whois-loading" style="display: none">
          Loading WHOIS data...
        </div>
      </div>
    </div>
    <div id="footer-include"></div>
    <script>
      (function () {
        const form = document.getElementById("whoisForm");
        const lookupBtn = document.getElementById("lookupBtn");
        const resultsBox = document.getElementById("whoisResultsBox");
        const errorDiv = document.getElementById("whoisError");
        const loadingDiv = document.getElementById("whoisLoading");
        const tabs = document.getElementById("whoisTabs");
        const tabHtml = document.getElementById("tab-html");
        const tabJson = document.getElementById("tab-json");
        const tabContentHtml = document.getElementById("tab-content-html");
        const tabContentJson = document.getElementById("tab-content-json");
        const summaryDiv = document.getElementById("whoisSummary");
        const jsonResults = document.getElementById("whoisJsonResults");
        const resultsCard = document.getElementById("resultsCard");
        const copyIcon = document.getElementById("copy-icon");
        const downloadIcon = document.getElementById("download-icon");
        let lastQuery = "";
        let lastRaw = "";
        let lastJson = {};
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          const domain = document.getElementById("domain").value.trim();
          if (!domain) {
            showError("Please enter a valid domain or IP.");
            return;
          }
          lookupBtn.disabled = true;
          errorDiv.style.display = "none";
          resultsBox.style.display = "none";
          summaryDiv.textContent = "";
          jsonResults.textContent = "";
          loadingDiv.style.display = "block";
          resultsCard.style.display = "none";
          lastQuery = domain;
          try {
            const resp = await fetch(
              "backend.php?domain=" + encodeURIComponent(domain)
            );
            const data = await resp.json();
            loadingDiv.style.display = "none";
            if (data && (data.raw || data.formatted)) {
              lastRaw = data.raw || data.formatted;
              lastJson = data;
              resultsBox.textContent = lastRaw;
              resultsBox.style.display = "block";
              summaryDiv.textContent = `WHOIS Information for ${domain}`;
              jsonResults.textContent = JSON.stringify(data, null, 2);
              resultsCard.style.display = "block";
            } else {
              showError("No WHOIS data found for this domain or IP.");
            }
          } catch (err) {
            loadingDiv.style.display = "none";
            showError("An error occurred while fetching WHOIS data.");
          }
          lookupBtn.disabled = false;
        });

        tabHtml.onclick = () => {
          tabHtml.classList.add("active");
          tabJson.classList.remove("active");
          tabContentHtml.style.display = "";
          tabContentJson.style.display = "none";
        };
        tabJson.onclick = () => {
          tabJson.classList.add("active");
          tabHtml.classList.remove("active");
          tabContentHtml.style.display = "none";
          tabContentJson.style.display = "";
        };

        copyIcon.onclick = () => {
          navigator.clipboard.writeText(jsonResults.textContent);
          alert("Copied JSON to clipboard.");
        };
        downloadIcon.onclick = () => {
          const blob = new Blob([lastRaw], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${lastQuery || "whois"}.txt`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
        function showError(message) {
          errorDiv.textContent = message;
          errorDiv.style.display = "block";
        }
      })();

      ["header", "footer"].forEach((id) => {
        fetch(`../${id}.html`)
          .then((r) => r.text())
          .then((html) => {
            document.getElementById(`${id}-include`).innerHTML = html;
          });
      });
    </script>
  </body>
</html>
