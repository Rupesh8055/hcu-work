<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iran Firewall Test</title>
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        background: #f6f8fa;
        margin: 0;
      }
      .container {
        max-width: 1150px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 32px 32px 24px 32px;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .desc {
        color: #555;
        margin-bottom: 24px;
      }
      .search-box {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }
      .search-box label {
        display: none;
      }
      .search-box input {
        flex: 1;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .search-box button {
        background: #7a0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 0 28px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: background 0.2s;
      }
      .search-box button:hover {
        background: #5a0000;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 0;
      }
      .tab {
        padding: 12px 0;
        font-weight: 500;
        color: #222;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        text-decoration: none;
      }
      .tab.active {
        border-bottom: 2px solid #7a0000;
        color: #7a0000;
      }
      .results-header {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 24px 0 8px 0;
      }
      .test-locations {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .location-card {
        background: #f8fafc;
        padding: 16px;
        border-radius: 8px;
      }
      .location-card h3 {
        color: #1f2937;
        font-size: 0.9rem;
        margin: 0 0 8px 0;
      }
      .location-card p {
        color: #4b5563;
        margin: 0;
        font-size: 1.1rem;
        font-weight: 500;
      }
      .status {
        font-weight: 600;
      }
      .error-msg {
        color: #b91c1c;
        background: #fee2e2;
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-weight: 500;
      }
      .loading {
        color: #7a0000;
        font-weight: bold;
        margin: 1em 0;
      }
      @media (max-width: 600px) {
        .container {
          padding: 1em;
        }
        .search-box {
          flex-direction: column;
        }
        table,
        th,
        td {
          font-size: 0.95em;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <div id="app">
      <div class="container">
        <h1>Iran Firewall Test</h1>
        <div class="desc">
          Test if your website is blocked by Iran's national firewall. Important
          for organizations with users in Iran to verify service accessibility
          and compliance with regional regulations.
        </div>
        <form class="search-box" autocomplete="off">
          <label for="url">Website URL</label>
          <input
            type="text"
            name="url"
            id="url"
            placeholder="Enter website URL (e.g. example.com)"
            required
            aria-label="Website URL"
          />
          <button type="submit">Test Accessibility</button>
        </form>
        <div class="tabs" style="display: none">
          <a href="#" class="tab active">HTML</a>
          <a href="#" class="tab">JSON</a>
        </div>
        <div class="results" style="margin-bottom: 32px">
          <div class="results-content"></div>
          <div id="error-msg" class="error-msg" style="display: none"></div>
          <div id="loading" class="loading" style="display: none">
            Loading...
          </div>
        </div>
      </div>
    </div>
    <div id="footer-include"></div>
    <script>
      (function () {
        let currentTab = "html";
        let lastQuery = "";
        let lastResults = {};
        const app = document.getElementById("app");
        const container = app.querySelector(".container");
        const form = container.querySelector(".search-box");
        const input = form.querySelector("input");
        const tabs = container.querySelector(".tabs");
        const htmlTab = tabs.querySelectorAll(".tab")[0];
        const jsonTab = tabs.querySelectorAll(".tab")[1];
        const resultsDiv = container.querySelector(".results");
        const resultsContent = resultsDiv.querySelector(".results-content");
        const errorMsg = document.getElementById("error-msg");
        const loadingDiv = document.getElementById("loading");
        function switchTab(tab) {
          currentTab = tab;
          htmlTab.className = "tab" + (tab === "html" ? " active" : "");
          htmlTab.style.borderBottom =
            tab === "html" ? "2px solid #7a0000" : "2px solid transparent";
          htmlTab.style.color = tab === "html" ? "#7a0000" : "#222";
          jsonTab.className = "tab" + (tab === "json" ? " active" : "");
          jsonTab.style.borderBottom =
            tab === "json" ? "2px solid #7a0000" : "2px solid transparent";
          jsonTab.style.color = tab === "json" ? "#7a0000" : "#222";
          renderResults(lastQuery, lastResults);
        }
        htmlTab.addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("html");
        });
        jsonTab.addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("json");
        });
        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          const query = input.value.trim();
          if (!query) return;
          errorMsg.style.display = "none";
          loadingDiv.style.display = "block";
          try {
            const resp = await fetch(
              "backend.php?url=" + encodeURIComponent(query)
            );
            const results = await resp.json();
            lastQuery = query;
            lastResults = results;
            renderResults(query, results);
            loadingDiv.style.display = "none";
          } catch (err) {
            loadingDiv.style.display = "none";
            errorMsg.textContent = "An error occurred while fetching results.";
            errorMsg.style.display = "block";
          }
        });
        function renderResults(query, results) {
          resultsContent.innerHTML = "";
          tabs.style.display = "none";
          if (!query) return;
          const header = document.createElement("div");
          header.className = "results-header";
          header.innerHTML = `Accessibility Test Results for <b>${escapeHtml(
            query
          )}</b>`;
          resultsContent.appendChild(header);
          if (currentTab === "json") {
            const json = {
              query: { tool: "iran-firewall-test", url: query },
              response: results,
            };
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(json, null, 2);
            pre.style.background = "#f3f4f6";
            pre.style.padding = "16px";
            pre.style.borderRadius = "8px";
            pre.style.overflow = "auto";
            pre.style.maxHeight = "420px";
            pre.style.fontSize = "1rem";
            pre.style.boxShadow = "none";
            pre.style.margin = "0";
            resultsContent.appendChild(pre);
            if (
              typeof results === "object" &&
              results !== null &&
              Object.keys(results).length > 0
            ) {
              tabs.style.display = "";
            }
          } else {
            const testLocations = document.createElement("div");
            testLocations.className = "test-locations";
            if (typeof results === "object" && results !== null) {
              Object.entries(results).forEach(([location, data]) => {
                const locationCard = document.createElement("div");
                locationCard.className = "location-card";
                const h3 = document.createElement("h3");
                h3.textContent = location;
                locationCard.appendChild(h3);
                const p = document.createElement("p");
                const status = document.createElement("span");
                status.className = "status status-" + data.status.toLowerCase();
                status.textContent = data.status;
                p.appendChild(status);
                locationCard.appendChild(p);
                testLocations.appendChild(locationCard);
              });
            }
            resultsContent.appendChild(testLocations);
            const table = document.createElement("table");
            table.innerHTML =
              "<thead><tr><th>Location</th><th>Status</th><th>Response Time</th><th>Details</th></tr></thead>";
            const tbody = document.createElement("tbody");
            if (typeof results === "object" && results !== null) {
              Object.entries(results).forEach(([location, data]) => {
                const tr = document.createElement("tr");
                const tdLocation = document.createElement("td");
                tdLocation.textContent = location;
                tr.appendChild(tdLocation);
                const tdStatus = document.createElement("td");
                const status = document.createElement("span");
                status.className = "status status-" + data.status.toLowerCase();
                status.textContent = data.status;
                tdStatus.appendChild(status);
                tr.appendChild(tdStatus);
                const tdResponseTime = document.createElement("td");
                tdResponseTime.textContent = data.response_time || "";
                tr.appendChild(tdResponseTime);
                const tdDetails = document.createElement("td");
                tdDetails.textContent = data.details || "";
                tr.appendChild(tdDetails);
                tbody.appendChild(tr);
              });
            }
            table.appendChild(tbody);
            resultsContent.appendChild(table);
            if (
              typeof results === "object" &&
              results !== null &&
              Object.keys(results).length > 0
            ) {
              tabs.style.display = "";
            }
          }
        }
        function escapeHtml(str) {
          return str.replace(/[&<>"']/g, function (tag) {
            const charsToReplace = {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            };
            return charsToReplace[tag] || tag;
          });
        }
        renderResults("", {});
      })();

      ["header", "footer"].forEach((id) => {
        fetch(`../${id}.html`)
          .then((r) => r.text())
          .then((html) => {
            document.getElementById(`${id}-include`).innerHTML = html;
          });
      });
    </script>
  </body>
</html>
